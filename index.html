<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noirpixels</title>
<style>
  :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1c1c1c; --line:#333; --accent:#f0b35a; }
  @media (prefers-color-scheme: light) { :root { --bg:#fafafa; --fg:#111; --muted:#666; --card:#fff; --line:#ddd; --accent:#b0651a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:28px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 32px; }
  a.game { display:block; padding:18px 20px; margin-bottom:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--fg); text-decoration:none; }
  a.game:hover { border-color:var(--accent); }
  a.game strong { display:block; font-size:18px; }
  a.game span { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>noirpixels</h1>
  <p>Games I'm making. Click one to play in your browser.</p>
  <a class="game" href="brielands/"><strong>Brielands</strong><span>You are the cheese.</span></a>
  <a class="game" href="pyrevalley/"><strong>Pyrevalley</strong><span>Fight ember beasts, craft gear, explore the caves.</span></a>
</main>
</body>
</html>
